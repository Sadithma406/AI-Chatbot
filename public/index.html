<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="phone-shell">
    <!-- Messages -->
    <div id="chat-messages">
      <div class="message bot">
        <div class="bubble">Hello! How can I help you today?</div>
      </div>
    </div>

    <!-- Input Bar -->
    <div id="input-area">
      <div id="user-text">
        <button class="mic-btn" id="mic-button" title="Voice input">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1.5 4v6a1.5 1.5 0 0 0 3 0V5a1.5 1.5 0 0 0-3 0zM6.5 10a.75.75 0 0 1 .75.75 4.75 4.75 0 0 0 9.5 0 .75.75 0 0 1 1.5 0 6.25 6.25 0 0 1-5.5 6.21V19h2a.75.75 0 0 1 0 1.5h-5.5a.75.75 0 0 1 0-1.5h2v-2.04A6.25 6.25 0 0 1 5.75 10.75.75.75 0 0 1 6.5 10z" />
          </svg>
        </button>
        <input type="text" id="user-input" placeholder="Type a message…" autocomplete="off" />
      </div>
      <button id="send-button" title="Send message">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M3.4 2.1 22 11.3a.8.8 0 0 1 0 1.4L3.4 21.9A.8.8 0 0 1 2.3 21l1.9-8.25L2.3 3A.8.8 0 0 1 3.4 2.1zm1.7 2.5 1.5 6.65h7.6a.75.75 0 0 1 0 1.5H6.6L5.1 19.4 20.1 12 5.1 4.6z" />
        </svg>
      </button>
    </div>

  </div>

  <script>
    const messagesEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-button');

    function appendMessage(text, role) {
      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }



    function hideTyping() {
      const el = document.getElementById('typing-wrapper');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      appendMessage(text, 'user');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });

        hideTyping();

        if (response.ok) {
          const data = await response.json();
          appendMessage(data.reply, 'bot');
        } else {
          const err = await response.json().catch(() => ({}));
          appendMessage(err.error ?? 'Something went wrong. Please try again.', 'bot');
        }
      } catch (err) {
        hideTyping();
        appendMessage('Could not reach the server. Please try again.', 'bot');
      }
    }

    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });


  </script>

</body>

</html>
